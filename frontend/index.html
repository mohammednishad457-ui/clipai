
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipAI - AI Shorts Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b12;color:#f5f5fa;font-family:Arial,sans-serif}
header{padding:24px 8%;border-bottom:1px solid #252535;font-size:25px;font-weight:bold}
.logo span{color:#9b7cff}
main{max-width:850px;margin:65px auto;padding:20px}
.hero{text-align:center;margin-bottom:35px}
.tag{color:#a88cff;letter-spacing:3px;font-size:12px}
h1{font-size:42px;margin:15px 0}
.hero p,.muted{color:#aaa}
.panel{background:#171722;border:1px solid #303044;border-radius:18px;padding:30px}
label{display:block;margin:15px 0 10px}
input,select{width:100%;padding:15px;background:#10101a;color:white;border:1px solid #44445a;border-radius:9px}
button{width:100%;padding:16px;margin-top:22px;background:#815cff;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:20px;color:#b9a7ff;overflow-wrap:anywhere}
.clips a{display:block;color:#b9a7ff;margin:15px 0}
footer{text-align:center;color:#777;padding:30px}
</style>
</head>
<body>
<header><div class="logo">Clip<span>AI</span></div></header>
<main>
<section class="hero">
<div class="tag">AI-POWERED VIDEO WORKSPACE</div>
<h1>Turn Videos Into Shorts</h1>
<p>Upload your video and create short clips.</p>
</section>

<section class="panel">
<label for="video">Upload your video</label>
<input id="video" type="file" accept="video/mp4,video/quicktime,video/webm,.m4v">

<label for="duration">Clip length</label>
<select id="duration">
<option value="15">15 Seconds</option>
<option value="30" selected>30 Seconds</option>
<option value="60">60 Seconds</option>
</select>

<button id="make">Create Clips</button>
<div class="status" id="status">Ready. Choose a video file to begin.</div>
<div class="clips" id="clips"></div>
</section>
</main>
<footer>© 2026 ClipAI</footer>

<script>
const API = "https://clipai-moch.vercel.app";
const button = document.getElementById("make");
const statusBox = document.getElementById("status");
const clipsBox = document.getElementById("clips");

button.addEventListener("click", async () => {
  const file = document.getElementById("video").files[0];
  const duration = document.getElementById("duration").value;

  clipsBox.innerHTML = "";

  if (!file) {
    statusBox.textContent = "Please choose a video file first.";
    return;
  }

  button.disabled = true;
  statusBox.textContent = "Uploading video...";

  try {
    const data = new FormData();
    data.append("video", file);
    data.append("clip_seconds", duration);

    const response = await fetch(`${API}/api/jobs?clip_seconds=${duration}`, {
      method: "POST",
      body: data
    });

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const job = await response.json();
    statusBox.textContent = "Video uploaded. Processing...";

    let finished = false;

    for (let i = 0; i < 60; i++) {
      await new Promise(resolve => setTimeout(resolve, 3000));

      const check = await fetch(`${API}/api/jobs/${job.job_id}`);
      if (!check.ok) throw new Error("Could not check processing status.");

      const result = await check.json();

      if (result.status === "completed") {
        clipsBox.innerHTML = result.clips.map(clip =>
          `<a href="${API}${clip.url}" target="_blank" download>
            Download ${clip.name}
          </a>`
        ).join("");

        statusBox.textContent = "Clips created successfully!";
        finished = true;
        break;
      }

      if (result.status === "failed") {
        throw new Error(result.error || "Video processing failed.");
      }

      statusBox.textContent = "Processing your video...";
    }

    if (!finished) {
      statusBox.textContent = "Processing is taking longer. Please check again later.";
    }

  } catch (error) {
    statusBox.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
